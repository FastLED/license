[project]
name = "fastled-license-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["running-process>=4.0.0", "zccache>=1.13.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12", "pyright>=1.1.400"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["tools", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
