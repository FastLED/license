schema_version = 1
old_license_ids = [
  "LicenseRef-FastLED-Reciprocal-1.0",
  "LicenseRef-FastLED-Reciprocal-1.0-rc1",
  "LicenseRef-FastLED-Reciprocal-1.0-rc2",
]

[license]
id = "LicenseRef-FastLED-Reciprocal-1.0-rc3"
header_version = 4
ai_document = "LICENSE-AI-AGENT-INSTRUCTIONS.md"
ai_document_sha256 = "51a0ef022d3ade2ff0b7412aff9db9d33adc954d9dbfb0402c11037ad6bf7603"

[profiles.release]
roots = ["src"]
extensions = ["h", "hpp", "cpp", "c", "cc", "cxx", "s", "S"]

[profiles.repository]
roots = ["src", "examples", "tests", "ci", "tools"]
extensions = ["h", "hpp", "cpp", "c", "cc", "cxx", "ino", "s", "S", "py", "js", "ts", "mts"]

[comments]
h = "//"
hpp = "//"
cpp = "//"
c = "//"
cc = "//"
cxx = "//"
ino = "//"
s = "//"
S = "//"
py = "#"
js = "//"
ts = "//"
mts = "//"

# Integrations must replace this example with a reviewed project inventory.
[[exclusions]]
pattern = "src/third_party/**"
reason = "Vendored or separately licensed source; preserve upstream notices."
provenance = "Per-component LICENSE/NOTICE files under src/third_party."
